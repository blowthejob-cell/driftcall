<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>DriftCall — Video Storefront</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Landing / Splash -->
  <div class="splash" id="splash">
    <div class="brand">
      <h1>DriftCall</h1>
      <p>Video chat with our store</p>
    </div>
    <div class="card">
      <label for="phone">Your phone number</label>
      <input
        type="tel"
        id="phone"
        placeholder="+1 (555) 000-0000"
        autocomplete="tel"
        inputmode="tel"
        maxlength="20"
      >
      <button class="btn btn-primary" id="startBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Start Video Call
      </button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- Video -->
  <div class="video-container" id="videoContainer">
    <div class="video-wrapper">
      <video id="remoteVideo" autoplay playsinline muted></video>
      <div class="local-tile">
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
    </div>
    <div class="video-controls">
      <button class="btn btn-ghost" id="camToggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Camera
      </button>
      <button class="btn btn-ghost" id="micToggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Mic
      </button>
      <button class="btn btn-danger" id="hangupBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 6.93 6.93l1.23-1.23a2 2 0 0 1 2.6-.22 2 2 0 0 1 .78 1.72v2.66a2 2 0 0 1-1.7 1.98A20 20 0 0 1 2 12a20 20 0 0 1 20-20c1.1 0 2.1.9 2 2a2 2 0 0 1-.22 2.6l-1.23 1.23z"/></svg>
        End
      </button>
    </div>
  </div>

  <script type="module">
    import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';

    const splash = document.getElementById('splash');
    const videoContainer = document.getElementById('videoContainer');
    const phoneInput = document.getElementById('phone');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const remoteVideo = document.getElementById('remoteVideo');
    const localVideo = document.getElementById('localVideo');
    const camToggle = document.getElementById('camToggle');
    const micToggle = document.getElementById('micToggle');
    const hangupBtn = document.getElementById('hangupBtn');

    let room = null;
    let isCameraOn = true;
    let isMicOn = true;

    // Enable start button only when phone has content
    phoneInput.addEventListener('input', () => {
      startBtn.disabled = phoneInput.value.trim().length < 3;
    });

    // Save phone to Supabase
    async function savePhone(phone) {
      const resp = await fetch('https://nnlfnfaywjenuhtazost.supabase.co/rest/v1/call_sessions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ubGZuZmF5d2plbnVodGF6b3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTY0NzUsImV4cCI6MjEwMTY5MjQ3NX0.s8-4BzbKSwWDe7yEVAH03xCi2-_vQh61TDFOCsobI2k',
          'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ubGZuZmF5d2plbnVodGF6b3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTY0NzUsImV4cCI6MjEwMTY5MjQ3NX0.s8-4BzbKSwWDe7yEVAH03xCi2-_vQh61TDFOCsobI2k',
        },
        body: JSON.stringify({ phone }),
      });
      if (!resp.ok) console.warn('Failed to save phone:', await resp.text());
    }

    // Fetch LiveKit token from Netlify serverless function
    async function getRoomToken(identity, roomName) {
      const resp = await fetch('/.netlify/functions/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity, room: roomName }),
      });
      if (!resp.ok) throw new Error('Failed to get room token');
      const data = await resp.json();
      return data.token;
    }

    // Join the call
    async function joinCall() {
      const phone = phoneInput.value.trim();
      if (!phone) return;

      startBtn.disabled = true;
      startBtn.innerHTML = '<span class="spinner"></span> Connecting...';
      statusEl.textContent = 'Requesting camera access...';
      statusEl.className = 'status';

      // Save phone number
      await savePhone(phone);

      // Generate identity from phone
      const identity = 'customer_' + phone.replace(/[^0-9]/g, '').slice(-8);
      const roomName = 'storefront';

      try {
        // Get token
        const token = await getRoomToken(identity, roomName);

        // Create and connect room
        room = new Room({
          adaptiveCodec: true,
          resumeAttempts: 0,
        });

        // Remote participant joined → show their video
        room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          if (publication.track === Track.VIDEO) {
            remoteVideo.srcObject = new MediaStream([track.mediaStreamTrack]);
          } else if (publication.track === Track.AUDIO) {
            track.mediaStreamTrack.addEventListener('ended', () => {});
            const audio = new AudioContext();
            const source = audio.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
            source.connect(audio.destination);
          }
        });

        // Remote participant left
        room.on(RoomEvent.ParticipantDisconnected, () => {
          statusEl.textContent = 'Customer disconnected';
          statusEl.className = 'status';
        });

        // Connection errors
        room.on(RoomEvent.Disconnected, () => {
          statusEl.textContent = 'Call ended';
          statusEl.className = 'status';
        });

        room.on(RoomEvent.Error, (err) => {
          console.error('Room error:', err);
        });

        statusEl.textContent = 'Connecting to call...';

        // Connect to LiveKit
        await room.connect(
          'wss://driftcall-a4yazf14.livekit.cloud',
          token
        );

        // Enable camera (front-facing) and mic
        await room.localParticipant.setCameraEnabled(true);
        await room.localParticipant.setMicrophoneEnabled(true);

        // Show video UI
        splash.style.display = 'none';
        videoContainer.classList.add('active');

        // Attach local video
        const localVideoTrack = room.localParticipant.getTrackPublication(Track.VIDEO)?.track;
        if (localVideoTrack) {
          localVideo.srcObject = new MediaStream([localVideoTrack.mediaStreamTrack]);
        }

        statusEl.textContent = 'You are live — the store owner can see you';
        statusEl.className = 'status connected';

      } catch (err) {
        console.error('Join failed:', err);
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'status error';
        startBtn.disabled = false;
        startBtn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Start Video Call
        `;
      }
    }

    // Camera toggle
    camToggle.addEventListener('click', async () => {
      if (!room) return;
      const pub = room.localParticipant.getTrackPublication(Track.VIDEO);
      if (pub) {
        isCameraOn = !isCameraOn;
        await pub.setEnabled(isCameraOn);
        camToggle.innerHTML = isCameraOn
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> Camera`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Camera`;
        camToggle.style.opacity = isCameraOn ? '1' : '0.5';
      }
    });

    // Mic toggle
    micToggle.addEventListener('click', async () => {
      if (!room) return;
      const pub = room.localParticipant.getTrackPublication(Track.AUDIO);
      if (pub) {
        isMicOn = !isMicOn;
        await pub.setEnabled(isMicOn);
        micToggle.innerHTML = isMicOn
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Mic`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/><path d="M13 15v3"/></svg> Mic`;
        micToggle.style.opacity = isMicOn ? '1' : '0.5';
      }
    });

    // Hang up
    hangupBtn.addEventListener('click', () => {
      if (room) {
        room.disconnect();
        room = null;
      }
      videoContainer.classList.remove('active');
      splash.style.display = 'flex';
      statusEl.textContent = '';
      statusEl.className = 'status';
      startBtn.disabled = false;
      startBtn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Start Video Call
      `;
    });

    startBtn.addEventListener('click', joinCall);
  </script>
</body>
</html>
